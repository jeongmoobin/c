<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPS 이동 경로 추적 및 시각화 시스템</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts (Inter & Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 현재 추적 위치 마커 펄스 효과 */
    .tracker-pulse {
      width: 24px;
      height: 24px;
      background-color: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(37, 99, 235, 0.7);
      animation: pulseRing 1.5s infinite ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tracker-pulse::after {
      content: '';
      width: 7px;
      height: 7px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    @keyframes pulseRing {
      0% {
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.75);
      }
      70% {
        box-shadow: 0 0 0 16px rgba(37, 99, 235, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
      }
    }

    /* 출발/도착 배지 스타일 */
    .endpoint-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #ffffff;
      border-radius: 9999px;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    input[type="range"] {
      accent-color: #2563eb;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 h-screen flex flex-col overflow-hidden select-none">

  <!-- 상단 네비게이션 및 파일 제어 바 -->
  <header class="bg-slate-900 text-white px-4 py-2.5 shadow-lg border-b border-slate-800 flex flex-wrap items-center justify-between gap-2.5 z-20">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow">
        <i class="fa-solid fa-satellite-dish text-white text-base"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm sm:text-base font-bold tracking-tight">GPS 이동 경로 시각화 및 추적 시스템</h1>
          <span id="dataSourceTag" class="text-[11px] font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full">
            gpsdata.csv (15개 포인트)
          </span>
        </div>
        <p class="text-[11px] text-slate-400 hidden sm:block">CSV → JSON(geo2json) → Leaflet 웹 지도 실시간 경로 분석</p>
      </div>
    </div>

    <!-- 우측 데이터 입출력 버튼 그룹 -->
    <div class="flex flex-wrap items-center gap-2">
      <!-- JSON / CSV 업로드 -->
      <label for="dataFileInput" class="cursor-pointer inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xs font-semibold px-3 py-2 rounded-xl shadow transition">
        <i class="fa-solid fa-file-arrow-up"></i>
        <span>CSV / JSON 불러오기</span>
      </label>
      <input type="file" id="dataFileInput" accept=".json,.csv,application/json,text/csv" class="hidden" />

      <!-- output.json 다운로드 버튼 -->
      <button id="downloadJsonBtn" type="button" title="geo2json.c 출력 형식과 동일한 output.json 다운로드" class="inline-flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-xl border border-slate-700 transition">
        <i class="fa-solid fa-download text-amber-400"></i>
        <span>output.json 저장</span>
      </button>

      <!-- 기본 15개 데이터 복원 버튼 -->
      <button id="restoreDefaultBtn" type="button" title="업로드된 gpsdata.csv 기본 15개 포인트로 복원" class="inline-flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-xl border border-slate-700 transition">
        <i class="fa-solid fa-rotate text-emerald-400"></i>
        <span class="hidden md:inline">기본 데이터</span>
      </button>
    </div>
  </header>

  <!-- 알림 토스트 (alert 대체용 UI) -->
  <div id="toastBox" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 -translate-y-2">
    <div class="bg-slate-900/95 backdrop-blur-md text-white text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-2xl border border-slate-700 flex items-center gap-2.5">
      <i id="toastIcon" class="fa-solid fa-circle-info text-blue-400"></i>
      <span id="toastMessage">알림 메시지</span>
    </div>
  </div>

  <!-- 메인 지도 및 플로팅 오버레이 영역 -->
  <main class="relative flex-1 w-full h-full overflow-hidden">
    <div id="map"></div>

    <!-- 우측 상단: 속도 범례 및 전체 주행 통계 카드 -->
    <aside class="absolute top-3 right-3 z-10 flex flex-col gap-2.5 w-52 sm:w-60">
      <!-- 속도 범례 패널 -->
      <div class="bg-white/95 backdrop-blur-md p-3.5 rounded-2xl shadow-xl border border-slate-200/90">
        <div class="flex items-center justify-between mb-2.5 pb-1.5 border-b border-slate-100">
          <span class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
            <i class="fa-solid fa-gauge-high text-blue-600"></i> 속도 범례
          </span>
          <span class="text-[10px] text-slate-400 font-medium">Speed 기준</span>
        </div>

        <ul class="space-y-2 text-xs font-medium text-slate-700">
          <li class="flex items-center justify-between">
            <span class="flex items-center gap-2">
              <span class="w-3.5 h-3.5 rounded-full inline-block border border-white shadow-sm" style="background-color: #16a34a;"></span>
              저속 (&lt; 18)
            </span>
            <span id="legendLowCount" class="text-[11px] bg-green-50 text-green-700 border border-green-200/60 px-2 py-0.5 rounded-md font-semibold">0개</span>
          </li>
          <li class="flex items-center justify-between">
            <span class="flex items-center gap-2">
              <span class="w-3.5 h-3.5 rounded-full inline-block border border-white shadow-sm" style="background-color: #eab308;"></span>
              중속 (18 ~ 20)
            </span>
            <span id="legendMidCount" class="text-[11px] bg-yellow-50 text-yellow-700 border border-yellow-200/60 px-2 py-0.5 rounded-md font-semibold">0개</span>
          </li>
          <li class="flex items-center justify-between">
            <span class="flex items-center gap-2">
              <span class="w-3.5 h-3.5 rounded-full inline-block border border-white shadow-sm" style="background-color: #dc2626;"></span>
              고속 (&gt; 20)
            </span>
            <span id="legendHighCount" class="text-[11px] bg-red-50 text-red-700 border border-red-200/60 px-2 py-0.5 rounded-md font-semibold">0개</span>
          </li>
        </ul>
      </div>

      <!-- 전체 경로 요약 카드 -->
      <div class="bg-white/95 backdrop-blur-md p-3 rounded-2xl shadow-xl border border-slate-200/90 hidden sm:block">
        <div class="text-[11px] font-bold text-slate-700 mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-chart-simple text-indigo-600"></i> 전체 경로 요약
        </div>
        <div class="grid grid-cols-2 gap-2 text-center">
          <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
            <div class="text-[10px] text-slate-400">총 이동 거리</div>
            <div id="totalDistanceText" class="text-xs font-bold text-slate-800 mt-0.5">0 m</div>
          </div>
          <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
            <div class="text-[10px] text-slate-400">평균 / 최고 속도</div>
            <div id="avgMaxSpeedText" class="text-xs font-bold text-blue-600 mt-0.5">0 / 0</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 하단 플로팅 실시간 경로 추적(Tracking) 대시보드 -->
    <section class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 w-[95%] max-w-3xl">
      <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-200/90 p-3.5 sm:p-4">

        <!-- 1행: 실시간 위치 텔레메트리 카드 -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
          <div class="bg-slate-50 px-3 py-2 rounded-xl border border-slate-200/70">
            <div class="text-[10px] text-slate-400 font-medium">현재 위도 (Latitude)</div>
            <div id="telemetryLat" class="font-mono text-xs sm:text-sm font-bold text-slate-800 mt-0.5">-</div>
          </div>
          <div class="bg-slate-50 px-3 py-2 rounded-xl border border-slate-200/70">
            <div class="text-[10px] text-slate-400 font-medium">현재 경도 (Longitude)</div>
            <div id="telemetryLng" class="font-mono text-xs sm:text-sm font-bold text-slate-800 mt-0.5">-</div>
          </div>
          <div class="bg-slate-50 px-3 py-2 rounded-xl border border-slate-200/70">
            <div class="text-[10px] text-slate-400 font-medium">현재 속도 (Speed)</div>
            <div class="mt-0.5 flex items-center gap-1.5">
              <span id="telemetrySpeedBadge" class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-bold bg-slate-200 text-slate-700">-</span>
            </div>
          </div>
          <div class="bg-slate-50 px-3 py-2 rounded-xl border border-slate-200/70">
            <div class="text-[10px] text-slate-400 font-medium">누적 이동 거리</div>
            <div id="telemetryCumDist" class="font-mono text-xs sm:text-sm font-bold text-blue-600 mt-0.5">0 m</div>
          </div>
        </div>

        <!-- 2행: 타임라인 슬라이더 및 지점 진행률 -->
        <div class="flex items-center gap-3 mb-3">
          <span id="stepIndicator" class="text-xs font-mono font-bold text-slate-600 whitespace-nowrap bg-slate-100 px-2.5 py-1 rounded-lg">
            1 / 15
          </span>
          <input id="timelineSlider" type="range" min="0" max="14" value="0" class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer" />
          <span id="percentIndicator" class="text-xs font-bold text-blue-600 whitespace-nowrap w-10 text-right">
            0%
          </span>
        </div>

        <!-- 3행: 재생 제어 버튼, 이전/다음 스텝, 배속 조절, 카메라 추적 -->
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 sm:gap-2">
            <!-- 재생 / 일시정지 버튼 -->
            <button id="playPauseBtn" type="button" class="inline-flex items-center justify-center gap-1.5 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-xl shadow transition min-w-[96px]">
              <i id="playPauseIcon" class="fa-solid fa-play"></i>
              <span id="playPauseLabel">추적 시작</span>
            </button>

            <!-- 이전 / 다음 포인트 이동 버튼 -->
            <div class="inline-flex items-center bg-slate-100 rounded-xl p-0.5 border border-slate-200/70">
              <button id="prevStepBtn" type="button" title="이전 지점" class="p-2 text-slate-600 hover:text-slate-900 hover:bg-white rounded-lg transition">
                <i class="fa-solid fa-backward-step text-xs"></i>
              </button>
              <button id="nextStepBtn" type="button" title="다음 지점" class="p-2 text-slate-600 hover:text-slate-900 hover:bg-white rounded-lg transition">
                <i class="fa-solid fa-forward-step text-xs"></i>
              </button>
            </div>

            <!-- 초기화 버튼 -->
            <button id="resetBtn" type="button" title="처음 위치로 초기화" class="inline-flex items-center gap-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3 py-2 rounded-xl transition">
              <i class="fa-solid fa-rotate-left"></i>
              <span class="hidden sm:inline">초기화</span>
            </button>

            <!-- 전체 경로 맞추기 -->
            <button id="fitRouteBtn" type="button" title="전체 경로가 한눈에 보이도록 확대/축소" class="inline-flex items-center gap-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3 py-2 rounded-xl transition">
              <i class="fa-solid fa-expand"></i>
              <span class="hidden md:inline">전체 보기</span>
            </button>
          </div>

          <div class="flex items-center gap-2">
            <!-- 카메라 자동 추적 체크박스 -->
            <label class="inline-flex items-center gap-1.5 cursor-pointer text-xs font-medium text-slate-600 bg-slate-50 px-2.5 py-1.5 rounded-xl border border-slate-200">
              <input id="followCameraCheck" type="checkbox" checked class="rounded text-blue-600 focus:ring-0" />
              <span>카메라 추적</span>
            </label>

            <!-- 재생 속도 선택 (0.5x, 1x, 2x) -->
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200/60">
              <button type="button" data-rate="0.5" class="rate-btn px-2 py-1 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition">0.5x</button>
              <button type="button" data-rate="1" class="rate-btn px-2 py-1 text-xs font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition">1x</button>
              <button type="button" data-rate="2" class="rate-btn px-2 py-1 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition">2x</button>
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    /**
     * =========================================================================
     * 1. 업로드된 gpsdata.csv의 실제 15개 GPS 데이터 포인트 (기본 내장 데이터)
     * =========================================================================
     */
    const DEFAULT_GPS_DATA = [
      { "latitude": 42.363400, "longitude": -71.098465, "info": "Speed = 21" },
      { "latitude": 42.363327, "longitude": -71.097588, "info": "Speed = 23" },
      { "latitude": 42.363255, "longitude": -71.096710, "info": "Speed = 17" },
      { "latitude": 42.363182, "longitude": -71.095833, "info": "Speed = 22" },
      { "latitude": 42.363110, "longitude": -71.094955, "info": "Speed = 14" },
      { "latitude": 42.363037, "longitude": -71.094078, "info": "Speed = 16" },
      { "latitude": 42.362965, "longitude": -71.093201, "info": "Speed = 18" },
      { "latitude": 42.362892, "longitude": -71.092323, "info": "Speed = 22" },
      { "latitude": 42.362820, "longitude": -71.091446, "info": "Speed = 17" },
      { "latitude": 42.362747, "longitude": -71.090569, "info": "Speed = 23" },
      { "latitude": 42.362675, "longitude": -71.089691, "info": "Speed = 14" },
      { "latitude": 42.362602, "longitude": -71.088814, "info": "Speed = 19" },
      { "latitude": 42.362530, "longitude": -71.087936, "info": "Speed = 16" },
      { "latitude": 42.362457, "longitude": -71.087059, "info": "Speed = 16" },
      { "latitude": 42.362385, "longitude": -71.086182, "info": "Speed = 21" }
    ];

    /**
     * =========================================================================
     * 2. 애플리케이션 전역 상태 관리
     * =========================================================================
     */
    const state = {
      points: [],            // 정규화된 GPS 포인트 목록
      currentIndex: 0,       // 현재 추적 중인 포인트 인덱스
      isPlaying: false,      // 애니메이션 재생 여부
      playbackRate: 1,       // 재생 배속 (0.5, 1, 2)
      animFrameId: null,     // requestAnimationFrame ID
      lastTimestamp: 0,      // 프레임 시간 계산용
      segmentProgress: 0,    // 현재 구간(i -> i+1) 내 보간 진행률 (0.0 ~ 1.0)
      toastTimer: null
    };

    // Leaflet 지도 및 레이어 객체
    let map;
    let routeLayerGroup;
    let passedPolyline;
    let trackerMarker;

    /**
     * =========================================================================
     * 3. 유틸리티 함수 (속도 파싱, 범례 등급 분류, 거리 계산, 알림 토스트)
     * =========================================================================
     */
    function showToast(message, type = 'info') {
      const box = document.getElementById('toastBox');
      const msgEl = document.getElementById('toastMessage');
      const iconEl = document.getElementById('toastIcon');

      msgEl.textContent = message;
      iconEl.className = type === 'error'
        ? 'fa-solid fa-circle-exclamation text-red-400'
        : type === 'success'
        ? 'fa-solid fa-circle-check text-emerald-400'
        : 'fa-solid fa-circle-info text-blue-400';

      box.classList.remove('opacity-0', '-translate-y-2');
      box.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => {
        box.classList.add('opacity-0', '-translate-y-2');
        box.classList.remove('opacity-100', 'translate-y-0');
      }, 3000);
    }

    // "Speed = 21" 문자열 또는 숫자에서 속도 추출
    function extractSpeed(item) {
      if (typeof item.speed === 'number' && !Number.isNaN(item.speed)) {
        return item.speed;
      }
      const infoStr = String(item.info || '');
      const match = infoStr.match(/(-?\d+(\.\d+)?)/);
      return match ? parseFloat(match[1]) : 0;
    }

    // 구성도 속도 범례 기준 분류: 저속(<18), 중속(18~20), 고속(>20)
    function classifySpeed(speed) {
      if (speed < 18) {
        return {
          level: '저속',
          color: '#16a34a', // green
          badgeClass: 'bg-green-100 text-green-800 border border-green-300'
        };
      }
      if (speed <= 20) {
        return {
          level: '중속',
          color: '#eab308', // yellow/gold
          badgeClass: 'bg-yellow-100 text-yellow-800 border border-yellow-300'
        };
      }
      return {
        level: '고속',
        color: '#dc2626', // red
        badgeClass: 'bg-red-100 text-red-800 border border-red-300'
      };
    }

    // 하버사인(Haversine) 공식으로 두 GPS 좌표 간 거리(미터) 계산
    function calcDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // 원본 JSON 또는 CSV 파싱 데이터 정규화 및 누적 거리 계산
    function normalizeGpsPoints(rawArray) {
      const normalized = [];
      let cumulativeDist = 0;

      rawArray.forEach((raw) => {
        const lat = Number(raw.latitude);
        const lng = Number(raw.longitude);
        if (Number.isNaN(lat) || Number.isNaN(lng)) return;

        const speed = extractSpeed(raw);
        const info = raw.info ? String(raw.info) : `Speed = ${speed}`;
        const meta = classifySpeed(speed);

        if (normalized.length > 0) {
          const prev = normalized[normalized.length - 1];
          cumulativeDist += calcDistanceMeters(prev.lat, prev.lng, lat, lng);
        }

        normalized.push({
          index: normalized.length,
          lat,
          lng,
          speed,
          info,
          level: meta.level,
          color: meta.color,
          badgeClass: meta.badgeClass,
          cumDist: cumulativeDist
        });
      });

      return normalized;
    }

    // CSV 텍스트 파싱 ("latitude,longitude,Speed = 21" 또는 헤더 포함 CSV 지원)
    function parseCsvToGpsArray(csvText) {
      const lines = csvText
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter((line) => line.length > 0);

      const result = [];
      for (const line of lines) {
        const parts = line.split(',').map((p) => p.trim());
        if (parts.length < 2) continue;

        const lat = parseFloat(parts[0]);
        const lng = parseFloat(parts[1]);
        // 헤더 행("latitude,longitude,info") 건너뛰기
        if (Number.isNaN(lat) || Number.isNaN(lng)) continue;

        const infoPart = parts.slice(2).join(', ') || 'Speed = 0';
        result.push({
          latitude: lat,
          longitude: lng,
          info: infoPart
        });
      }
      return result;
    }

    /**
     * =========================================================================
     * 4. Leaflet 지도 초기화 및 경로 렌더링
     * =========================================================================
     */
    function initMap() {
      map = L.map('map', {
        zoomControl: true
      }).setView([42.3629, -71.0923], 16);

      // OpenStreetMap 타일 레이어
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      routeLayerGroup = L.layerGroup().addTo(map);
    }

    function renderRouteOnMap(rawData, sourceLabel) {
      pauseTracking();

      const points = normalizeGpsPoints(rawData);
      if (points.length === 0) {
        showToast('유효한 GPS 좌표 데이터가 없습니다.', 'error');
        return;
      }

      state.points = points;
      state.currentIndex = 0;
      state.segmentProgress = 0;

      // 상단 데이터 소스 배지 업데이트
      document.getElementById('dataSourceTag').textContent = `${sourceLabel} (${points.length}개 포인트)`;

      // 기존 레이어 초기화
      routeLayerGroup.clearLayers();

      const allLatLngs = points.map((p) => [p.lat, p.lng]);

      // 1) 전체 예정 경로 점선 폴리라인
      L.polyline(allLatLngs, {
        color: '#64748b',
        weight: 3,
        opacity: 0.55,
        dashArray: '6, 6'
      }).addTo(routeLayerGroup);

      // 2) 지나온 경로 강조 실선 폴리라인
      passedPolyline = L.polyline([allLatLngs[0]], {
        color: '#2563eb',
        weight: 4.5,
        opacity: 0.9
      }).addTo(routeLayerGroup);

      // 3) 속도 범례 통계 집계 및 각 포인트 원형 마커 생성
      let lowCnt = 0;
      let midCnt = 0;
      let highCnt = 0;
      let sumSpeed = 0;
      let maxSpeed = -Infinity;

      points.forEach((pt) => {
        if (pt.speed < 18) lowCnt++;
        else if (pt.speed <= 20) midCnt++;
        else highCnt++;

        sumSpeed += pt.speed;
        if (pt.speed > maxSpeed) maxSpeed = pt.speed;

        const circleMarker = L.circleMarker([pt.lat, pt.lng], {
          radius: 7,
          color: '#ffffff',
          weight: 2,
          fillColor: pt.color,
          fillOpacity: 0.92
        });

        // 클릭 시 상세 팝업
        const popupHtml = `
          <div style="min-width: 175px; font-family: 'Inter', 'Noto Sans KR', sans-serif;">
            <div style="display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #e2e8f0; padding-bottom:4px; margin-bottom:6px;">
              <strong style="font-size:13px; color:#0f172a;">지점 #${pt.index + 1}</strong>
              <span style="font-size:11px; font-weight:700; color:#fff; background:${pt.color}; padding:1px 7px; border-radius:999px;">
                ${pt.level}
              </span>
            </div>
            <div style="font-size:12px; color:#334155; line-height:1.55;">
              <div><strong>위도:</strong> ${pt.lat.toFixed(6)}</div>
              <div><strong>경도:</strong> ${pt.lng.toFixed(6)}</div>
              <div><strong>속도:</strong> ${pt.speed} (${pt.info})</div>
              <div><strong>누적 거리:</strong> ${Math.round(pt.cumDist)} m</div>
            </div>
          </div>
        `;
        circleMarker.bindPopup(popupHtml);

        // 마커 클릭 시 해당 지점으로 추적 위치 즉시 이동
        circleMarker.on('click', () => {
          pauseTracking();
          jumpToStep(pt.index);
        });

        circleMarker.addTo(routeLayerGroup);
      });

      // 4) 출발(S) 및 도착(E) 라벨 마커
      if (points.length >= 2) {
        const startPt = points[0];
        const endPt = points[points.length - 1];

        L.marker([startPt.lat, startPt.lng], {
          icon: L.divIcon({
            className: '',
            html: '<div class="endpoint-badge" style="width:20px;height:20px;background:#0f172a;">S</div>',
            iconSize: [20, 20],
            iconAnchor: [10, 24]
          }),
          interactive: false
        }).addTo(routeLayerGroup);

        L.marker([endPt.lat, endPt.lng], {
          icon: L.divIcon({
            className: '',
            html: '<div class="endpoint-badge" style="width:20px;height:20px;background:#dc2626;">E</div>',
            iconSize: [20, 20],
            iconAnchor: [10, 24]
          }),
          interactive: false
        }).addTo(routeLayerGroup);
      }

      // 5) 실시간 추적 이동 마커 (펄스 아이콘)
      trackerMarker = L.marker([points[0].lat, points[0].lng], {
        icon: L.divIcon({
          className: '',
          html: '<div class="tracker-pulse"></div>',
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        }),
        zIndexOffset: 1000
      }).addTo(routeLayerGroup);

      // 범례 및 통계 UI 갱신
      document.getElementById('legendLowCount').textContent = `${lowCnt}개`;
      document.getElementById('legendMidCount').textContent = `${midCnt}개`;
      document.getElementById('legendHighCount').textContent = `${highCnt}개`;

      const totalDist = points[points.length - 1].cumDist;
      const avgSpeed = (sumSpeed / points.length).toFixed(1);
      document.getElementById('totalDistanceText').textContent = `${Math.round(totalDist).toLocaleString()} m`;
      document.getElementById('avgMaxSpeedText').textContent = `${avgSpeed} / ${maxSpeed}`;

      // 슬라이더 범위 설정
      const slider = document.getElementById('timelineSlider');
      slider.min = 0;
      slider.max = Math.max(0, points.length - 1);
      slider.value = 0;

      // 첫 지점 텔레메트리 반영 및 지도 영역 맞춤
      jumpToStep(0, false);
      fitEntireRoute();
    }

    function fitEntireRoute() {
      if (state.points.length === 0) return;
      const bounds = L.latLngBounds(state.points.map((p) => [p.lat, p.lng]));
      map.fitBounds(bounds, { padding: [65, 65], maxZoom: 17 });
    }

    /**
     * =========================================================================
     * 5. 실시간 추적(Tracking) 애니메이션 및 텔레메트리 업데이트
     * =========================================================================
     */
    function updateTelemetryUI(pt, interpolatedLat, interpolatedLng, interpolatedDist) {
      const total = state.points.length;
      document.getElementById('telemetryLat').textContent = interpolatedLat.toFixed(6);
      document.getElementById('telemetryLng').textContent = interpolatedLng.toFixed(6);

      const speedBadge = document.getElementById('telemetrySpeedBadge');
      speedBadge.textContent = `${pt.speed} (${pt.level})`;
      speedBadge.className = `inline-flex items-center px-2 py-0.5 rounded-md text-xs font-bold ${pt.badgeClass}`;

      document.getElementById('telemetryCumDist').textContent = `${Math.round(interpolatedDist).toLocaleString()} m`;
      document.getElementById('stepIndicator').textContent = `${pt.index + 1} / ${total}`;

      const pct = total > 1 ? Math.round(((pt.index + state.segmentProgress) / (total - 1)) * 100) : 100;
      document.getElementById('percentIndicator').textContent = `${Math.min(100, pct)}%`;
      document.getElementById('timelineSlider').value = pt.index;
    }

    function jumpToStep(index, panCamera = true) {
      if (state.points.length === 0) return;
      const clamped = Math.max(0, Math.min(state.points.length - 1, index));
      state.currentIndex = clamped;
      state.segmentProgress = 0;

      const pt = state.points[clamped];
      trackerMarker.setLatLng([pt.lat, pt.lng]);

      // 지나온 경로 폴리라인 업데이트
      const passedCoords = state.points.slice(0, clamped + 1).map((p) => [p.lat, p.lng]);
      passedPolyline.setLatLngs(passedCoords);

      updateTelemetryUI(pt, pt.lat, pt.lng, pt.cumDist);

      if (panCamera && document.getElementById('followCameraCheck').checked) {
        map.panTo([pt.lat, pt.lng], { animate: true, duration: 0.35 });
      }
    }

    function animationLoop(timestamp) {
      if (!state.isPlaying) return;

      if (!state.lastTimestamp) {
        state.lastTimestamp = timestamp;
      }
      const dt = (timestamp - state.lastTimestamp) / 1000; // 초 단위 경과 시간
      state.lastTimestamp = timestamp;

      // 기본 1x 배속 기준 초당 1.4구간 이동
      const stepDelta = dt * 1.4 * state.playbackRate;
      state.segmentProgress += stepDelta;

      while (state.segmentProgress >= 1 && state.currentIndex < state.points.length - 1) {
        state.segmentProgress -= 1;
        state.currentIndex += 1;
      }

      // 마지막 지점 도착 시 종료 처리
      if (state.currentIndex >= state.points.length - 1) {
        state.currentIndex = state.points.length - 1;
        state.segmentProgress = 0;
        jumpToStep(state.currentIndex, true);
        pauseTracking();
        showToast('전체 GPS 이동 경로 추적이 완료되었습니다.', 'success');
        return;
      }

      // 현재 지점(i)과 다음 지점(i+1) 사이의 부드러운 선형 보간 이동
      const currPt = state.points[state.currentIndex];
      const nextPt = state.points[state.currentIndex + 1];
      const t = state.segmentProgress;

      const interpLat = currPt.lat + (nextPt.lat - currPt.lat) * t;
      const interpLng = currPt.lng + (nextPt.lng - currPt.lng) * t;
      const interpDist = currPt.cumDist + (nextPt.cumDist - currPt.cumDist) * t;

      trackerMarker.setLatLng([interpLat, interpLng]);

      const passedCoords = state.points.slice(0, state.currentIndex + 1).map((p) => [p.lat, p.lng]);
      passedCoords.push([interpLat, interpLng]);
      passedPolyline.setLatLngs(passedCoords);

      updateTelemetryUI(currPt, interpLat, interpLng, interpDist);

      if (document.getElementById('followCameraCheck').checked) {
        map.panTo([interpLat, interpLng], { animate: false });
      }

      state.animFrameId = requestAnimationFrame(animationLoop);
    }

    function startTracking() {
      if (state.points.length < 2) {
        showToast('추적할 이동 경로 포인트가 부족합니다.', 'error');
        return;
      }

      // 이미 마지막 지점에 도달해 있다면 처음부터 다시 재생
      if (state.currentIndex >= state.points.length - 1) {
        jumpToStep(0, true);
      }

      state.isPlaying = true;
      state.lastTimestamp = 0;

      document.getElementById('playPauseIcon').className = 'fa-solid fa-pause';
      document.getElementById('playPauseLabel').textContent = '일시정지';

      state.animFrameId = requestAnimationFrame(animationLoop);
    }

    function pauseTracking() {
      state.isPlaying = false;
      if (state.animFrameId) {
        cancelAnimationFrame(state.animFrameId);
        state.animFrameId = null;
      }
      document.getElementById('playPauseIcon').className = 'fa-solid fa-play';
      document.getElementById('playPauseLabel').textContent = '추적 시작';
    }

    /**
     * =========================================================================
     * 6. 외부 ./output.json 자동 탐색, 파일 업로드 및 output.json 다운로드
     * =========================================================================
     */
    async function tryLoadExternalOutputJson() {
      // http/https 웹 서버 환경(예: python -m http.server 8000)인 경우 ./output.json 우선 확인
      if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        try {
          const response = await fetch('./output.json', { cache: 'no-store' });
          if (response.ok) {
            const externalData = await response.json();
            if (Array.isArray(externalData) && externalData.length > 0) {
              renderRouteOnMap(externalData, 'output.json (서버 로드)');
              showToast('서버의 output.json 데이터를 자동으로 불러왔습니다.', 'success');
              return;
            }
          }
        } catch (err) {
          // output.json이 없는 경우 내장 gpsdata.csv 15개 포인트 사용
        }
      }

      // 기본값: 업로드된 gpsdata.csv의 실제 15개 데이터 포인트 렌더링
      renderRouteOnMap(DEFAULT_GPS_DATA, 'gpsdata.csv');
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target.result;
        const lowerName = file.name.toLowerCase();

        try {
          let parsedData = [];
          if (lowerName.endsWith('.csv')) {
            parsedData = parseCsvToGpsArray(text);
          } else {
            const jsonObj = JSON.parse(text);
            if (!Array.isArray(jsonObj)) {
              throw new Error('JSON 최상위 구조가 배열([ ... ])이 아닙니다.');
            }
            parsedData = jsonObj;
          }

          if (parsedData.length === 0) {
            throw new Error('유효한 위도/경도 행을 찾을 수 없습니다.');
          }

          renderRouteOnMap(parsedData, file.name);
          showToast(`'${file.name}' (${parsedData.length}개 지점) 로드 완료!`, 'success');
        } catch (err) {
          showToast(`파일 파싱 오류: ${err.message}`, 'error');
        } finally {
          event.target.value = '';
        }
      };

      reader.readAsText(file, 'UTF-8');
    }

    // geo2json.c 출력과 동일한 형식의 output.json 다운로드
    function downloadOutputJson() {
      if (state.points.length === 0) return;

      const exportArray = state.points.map((pt) => ({
        latitude: Number(pt.lat.toFixed(6)),
        longitude: Number(pt.lng.toFixed(6)),
        info: pt.info
      }));

      const jsonString = JSON.stringify(exportArray, null, 2);
      const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = url;
      link.download = 'output.json';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      showToast('geo2json 형식의 output.json 파일이 다운로드되었습니다.', 'success');
    }

    /**
     * =========================================================================
     * 7. 이벤트 리스너 바인딩 및 초기화
     * =========================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      tryLoadExternalOutputJson();

      // 파일 업로드 & 다운로드 & 기본 복원
      document.getElementById('dataFileInput').addEventListener('change', handleFileUpload);
      document.getElementById('downloadJsonBtn').addEventListener('click', downloadOutputJson);
      document.getElementById('restoreDefaultBtn').addEventListener('click', () => {
        renderRouteOnMap(DEFAULT_GPS_DATA, 'gpsdata.csv');
        showToast('기본 gpsdata.csv (15개 포인트)로 복원되었습니다.', 'info');
      });

      // 재생 / 일시정지 토글
      document.getElementById('playPauseBtn').addEventListener('click', () => {
        if (state.isPlaying) {
          pauseTracking();
        } else {
          startTracking();
        }
      });

      // 이전 / 다음 지점 이동
      document.getElementById('prevStepBtn').addEventListener('click', () => {
        pauseTracking();
        jumpToStep(state.currentIndex - 1, true);
      });

      document.getElementById('nextStepBtn').addEventListener('click', () => {
        pauseTracking();
        jumpToStep(state.currentIndex + 1, true);
      });

      // 초기화 & 전체 경로 보기
      document.getElementById('resetBtn').addEventListener('click', () => {
        pauseTracking();
        jumpToStep(0, true);
      });

      document.getElementById('fitRouteBtn').addEventListener('click', fitEntireRoute);

      // 타임라인 슬라이더 수동 조작
      document.getElementById('timelineSlider').addEventListener('input', (e) => {
        pauseTracking();
        const targetIdx = parseInt(e.target.value, 10);
        jumpToStep(targetIdx, true);
      });

      // 재생 속도(0.5x, 1x, 2x) 버튼 전환
      document.querySelectorAll('.rate-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.playbackRate = parseFloat(btn.dataset.rate);
          document.querySelectorAll('.rate-btn').forEach((b) => {
            b.className = 'rate-btn px-2 py-1 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition';
          });
          btn.className = 'rate-btn px-2 py-1 text-xs font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition';
        });
      });

      // 창 크기 변경 시 지도 크기 재계산
      window.addEventListener('resize', () => {
        if (map) map.invalidateSize();
      });
    });
  </script>
</body>
</html>
